<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b1526">
<meta name="description" content="数桥 HASHI：在岛屿之间架桥，让每座岛的桥数等于它的数字。解数=1 由穷举计数器证明，推理深度由规则求解器量出。"><meta property="og:title" content="数桥 · HASHI"><meta property="og:description" content="数桥 HASHI：在岛屿之间架桥，让每座岛的桥数等于它的数字。解数=1 由穷举计数器证明，推理深度由规则求解器量出。"><meta property="og:image" content="https://z-biz-game.github.io/z-biz-game-hashi-cos/icons/icon-512.png"><meta name="twitter:image" content="https://z-biz-game.github.io/z-biz-game-hashi-cos/icons/icon-512.png">
<link rel="icon" href="data:,">
<title>数桥 · HASHI</title>
<link rel="stylesheet" href="css/game.css">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <h1 class="brand"><span class="brand-mark">◍</span>数桥<small>HASHI</small></h1>
  <nav class="modes" id="modes" aria-label="模式">
    <button type="button" data-mode="campaign">战役</button>
    <button type="button" data-mode="daily">每日</button>
    <button type="button" data-mode="random">随机</button>
      <button type="button" id="btn-fullscreen" aria-pressed="false" title="全屏 (F)">全屏</button>
  </nav>
  <p class="totals" id="totals"></p>
</header>

<main class="stage">
  <section class="board">
    <canvas id="sea" aria-label="数桥海域图"></canvas>
    <p class="hint-line" id="hintline"></p>
    <div class="curtain" id="curtain" hidden>
      <div class="curtain-card">
        <p class="stars" id="stars"></p>
        <h2 id="verdict"></h2>
        <p class="tally" id="tally"></p>
        <div class="curtain-actions">
          <button type="button" id="again">再来一次</button>
          <button type="button" id="next" class="primary">下一关</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <p class="crumbs" id="crumbs"></p>
    <dl class="readout" id="readout"></dl>
    <div class="controls">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="hint">提示</button>
      <button type="button" id="restart">重开</button>
      <button type="button" id="share">分享</button>
    </div>
    <div class="shelf" id="shelf"></div>
    <details class="about">
      <summary>这一关的数字从哪来</summary>
      <p>屏幕上这四个数都不是感觉：<code>Σp</code> 与 <code>桥数 = Σp/2</code> 是握手引理的恒等式，逐根数一遍已架的桥就能对上；<code>解数=1</code> 由 <code>js/core/count.js</code> 的穷举计数器证明（不唯一就不出厂）；<code>推理深度</code> 是 <code>js/core/logic.js</code> 那套规则被迫猜几层，换规则集这个数字就会变。</p>
      <p>关卡来自 <code>tools/bake.mjs</code>：构建期先造连通的桥图，再读数字，再验唯一解。浏览器不做生成。</p>
      <p class="save">成绩只存在这台设备的浏览器里。<button type="button" id="wipe">清空存档</button></p>
    </details>
  </aside>
</main>

<p class="toast" id="toast" hidden></p>
<script type="module" src="js/main.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
