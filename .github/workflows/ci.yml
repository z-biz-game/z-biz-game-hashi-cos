name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule, the counter, the reasoning solver and the shipped pool are all pure ES modules:
  # no browser and no install step. Three rows are the reason this job exists:
  #   * count.test.mjs — every hand-derived fixture is re-counted and cross-checked against a
  #     brute-force 3^slots enumerator that shares no search code, plus all 251 single-clue
  #     erasures of the shipped pool;
  #   * model.test.mjs — the four legality constraints and the handshake identity (Σp is even,
  #     the root target is exactly Σp/2);
  #   * library.test.mjs — re-counts and re-reasons every row of js/data/lots.js, so a
  #     hand-edited difficulty number or a stale bake fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: for f in test/*.test.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done
      # The difficulty leg, by the same command a human types locally. Until now the only thing
      # that ever ran `test/balance.mjs` at merge time was doctest's internal spawn (D5a asserts
      # its rc), so a workflow reading that never mentioned a balance step: the leg existed, but
      # nothing at the merge gate named it. It costs 0.24s measured (4 tiers x 8 seeds), so the
      # full default run is what CI gets.
      - name: Balance (difficulty rig)
        run: npm run balance
      # Two documentation-honesty gates, both pure logic (no browser): doctest re-derives every
      # number README/DESIGN prints from the engine or from balance and asserts equality; sabotage
      # then breaks one file at a time to prove each assertion group really goes RED and names the
      # assertion it killed. Their size is pinned inside the gates and again in tools/verify.sh.
      - name: Doctest (文档数字闸)
        run: node tools/doctest.mjs
      - name: Sabotage (破坏试验台账)
        run: node tools/sabotage.mjs
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit
  # test, the refused-drag rule and the save file all live behind `window.hashi`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
