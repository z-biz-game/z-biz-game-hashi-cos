name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no dependencies: the game ships plain ES modules, so the site is a
      # file copy. Keep the server, the electron shell, the bake tool and the tests out of the
      # artifact — but the *art* does ship: index.html and manifest.webmanifest reference
      # icons/*, the canvas loads assets/*.png (baked by assets/gen/make_art.py), and the PWA
      # needs manifest + sw.js + sw-register.js. Dropping any of those is a 404 on the deployed
      # site: no install prompt, no favicon, and the textures silently fall back to procedural.
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Verify every referenced path is in the artifact
        # 这一格调的是仓里那一道闸（它同时也在 ci.yml 与 npm run deploy-set 里跑），不再抄一份内联的
        # node -e。抄的那一份把 og:image 的**绝对 URL**当成产物目录里的相对路径去找，图标写对的那天它反而红：
        # 上线的部署自此连红两跑，站点停在旧构建，而仓里每一条本地腿照旧全绿。闸认的是"调用这一行"（W5）。
        run: node tools/deploy-set.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
